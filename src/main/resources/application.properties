logging.level.org.springframework=INFO
logging.level.org.springframework.boot.actuate.endpoint.web=DEBUG

management.endpoints.enabled-by-default=true
spring.web.error.include-stacktrace=ALWAYS
server.port=8080
spring.main.web-application-type=reactive
spring.webflux.base-path=/
spring.webflux.static-path-pattern=/public/**
spring.webflux.webjars-path-pattern=/webjars/**
spring.messages.basename=i18n/messages
server.forward-headers-strategy=framework
spring.webflux.codecs.max-in-memory-size=1MB

#
# Issuer options
#
issuer.publicUrl=http://localhost:8080
issuer.authorizationServer.publicUrl=https://localhost/idp/realms/pid-issuer-realm
issuer.authorizationServer.metadata=${issuer.authorizationServer.publicUrl}/.well-known/openid-configuration
issuer.authorizationServer.introspection=${issuer.authorizationServer.publicUrl}/protocol/openid-connect/token/introspect
issuer.credentialRequestEncryption.supported=true
issuer.credentialRequestEncryption.required=true
issuer.credentialRequestEncryption.jwks=GenerateRandom
issuer.credentialRequestEncryption.encryptionMethods=A128GCM
issuer.credentialRequestEncryption.zipAlgorithmsSupported=DEF
issuer.credentialResponseEncryption.supported=true
issuer.credentialResponseEncryption.required=true
issuer.credentialResponseEncryption.algorithmsSupported=ECDH-ES
issuer.credentialResponseEncryption.encryptionMethods=A128GCM
issuer.credentialResponseEncryption.zipAlgorithmsSupported=DEF
issuer.pid.mso_mdoc.enabled=true
issuer.pid.mso_mdoc.signing-key=GenerateRandom
issuer.pid.mso_mdoc.encoder.duration=P30D
issuer.pid.mso_mdoc.notifications.enabled=true
issuer.pid.mso_mdoc.jwtProofs.supportedSigningAlgorithms=ES256
issuer.pid.sd_jwt_vc.enabled=true
issuer.pid.sd_jwt_vc.signing-key=GenerateRandom
issuer.pid.sd_jwt_vc.duration=P30D
issuer.pid.sd_jwt_vc.notUseBefore=PT20S
issuer.pid.sd_jwt_vc.notifications.enabled=true
issuer.pid.sd_jwt_vc.digests.hashAlgorithm=sha-256
issuer.pid.sd_jwt_vc.jwtProofs.supportedSigningAlgorithms=ES256
issuer.pid.issuingCountry=GR
issuer.pid.issuingJurisdiction=GR-I
# Schema-driven credentials: every unmodified JSON Schema (*.json) in this
# directory is one credential. vct defaults to the schema's $id; the
# configuration id and scope are <vct>:dc+sd-jwt-compact and <vct>:dc+sd-jwt;
# the display name is the schema's title. Per-schema overrides, keyed by the
# file name without .json, go in the imported credentials.properties:
#   issuer.credential-overrides[<name>].vct / credential-configuration-id /
#   scope / display-name, plus any key of issuer.credential-defaults below.
issuer.credential-schemas.location=file:../../schemas/
spring.config.import=optional:file:../../config/pid-issuer/credentials.properties
issuer.credential-defaults.enabled=true
issuer.credential-defaults.signing-key=GenerateRandom
issuer.credential-defaults.sdJwtVc.encoder.digests.hashAlgorithm=sha-256
issuer.credential-defaults.validity=P30D
issuer.credential-defaults.notifications.enabled=true
issuer.credential-defaults.jwtProofs.supportedSigningAlgorithms=ES256
issuer.credential-defaults.key_attestations.required=false
# Wallet card styling (BMI EAA credential styling guidance): PNG logo without
# padding, 4:3 background image, both PNG <= 150 KB, alt text for both. The
# wallet draws the detail title in white, so the colour must be dark enough.
# One display entry per locale: the wallet needs one matching the phone language.
issuer.credential-defaults.display.locales=en,de
issuer.credential-defaults.display.logo.uri=${issuer.publicUrl}/public/img/forest-you/credential-logo.png
issuer.credential-defaults.display.logo.alternative-text=Forest-you logo: a pine credential in a green wallet
issuer.credential-defaults.display.background-color=#2D7A52
issuer.credential-defaults.display.background-image.uri=${issuer.publicUrl}/public/img/forest-you/credential-background.png
issuer.credential-defaults.display.background-image.alternative-text=Snow-covered alpine peak framed by spruce and larch forest
issuer.credential-defaults.display.text-color=#FFFFFF
issuer.forest.binding-url=http://localhost:8088/internal/issuance-bindings
issuer.forest.binding-secret=forest-binding-dev-secret
issuer.credentialOffer.uri=openid-credential-offer://
issuer.access-token.type=DPoP
issuer.dpop.proof-max-age=PT1M
issuer.dpop.cache-purge-interval=PT10M
issuer.dpop.realm=pid-issuer
issuer.dpop.nonce.enabled=true
issuer.dpop.nonce.expiration=PT5M
issuer.credentialEndpoint.batchIssuance.enabled=true
issuer.credentialEndpoint.batchIssuance.batchSize=20
issuer.metadata.signed-metadata.enabled=true
issuer.access-certificate=GenerateRandom
issuer.metadata.display[0].name=Forest-you
issuer.metadata.display[0].locale=en
issuer.metadata.display[0].logo.uri=${issuer.publicUrl}/public/img/forest-you/credential-logo.png
issuer.metadata.display[0].logo.alternative-text=Forest-you logo
issuer.metadata.display[1].name=\u0395\u03ba\u03b4\u03cc\u03c4\u03b7\u03c2 \u03a8\u03b7\u03c6\u03b9\u03b1\u03ba\u03ce\u03bd \u0394\u03b9\u03b1\u03c0\u03b9\u03c3\u03c4\u03b5\u03c5\u03c4\u03b7\u03c1\u03af\u03c9\u03bd
issuer.metadata.display[1].locale=el
issuer.metadata.display[1].logo.uri=${issuer.publicUrl}/public/img/forest-you/credential-logo.png
issuer.metadata.display[1].logo.alternative-text=\u039b\u03bf\u03b3\u03cc\u03c4\u03c5\u03c0\u03bf \u0395\u03c5\u03c1\u03c9\u03c0\u03b1\u03ca\u03ba\u03bf\u03cd \u03a0\u03bf\u03c1\u03c4\u03bf\u03c6\u03bf\u03bb\u03b9\u03bf\u03cd \u03a8\u03b7\u03c6\u03b9\u03b1\u03ba\u03ae\u03c2 \u03a4\u03b1\u03c5\u03c4\u03cc\u03c4\u03b7\u03c4\u03b1\u03c2
issuer.cnonce.expiration=PT5M
issuer.statusList.enabled=false
issuer.statusList.service.uri=
issuer.statusList.service.apiKey=
issuer.sd-jwt-vc.type-metadata[0].vct=urn:eudi:pid:1
issuer.sd-jwt-vc.type-metadata[0].resource=classpath:/vct/pid_v1.4.json

