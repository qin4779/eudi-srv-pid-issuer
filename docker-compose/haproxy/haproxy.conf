global
    maxconn 50000
    log stdout format raw local0
    user root
    group root
    nbthread 4
    cpu-map auto:1/1-4 0-3
    ssl-default-bind-options ssl-min-ver TLSv1.1

defaults
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    log global
    mode http
    option httplog
    maxconn 3000
    default_backend no-match

# Docker assigns a new IP whenever a service container is recreated. Resolve
# service names continuously so HAProxy does not keep forwarding to a stale IP.
resolvers docker
    nameserver docker_dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s
    hold valid 10s
    hold obsolete 10s

frontend all
    bind 0.0.0.0:80
    bind 0.0.0.0:443 ssl crt /etc/ssl/certs/localhost.tls.pem
    use_backend keycloak-backend if { path_beg /idp }
    use_backend keycloak-backend if { path_beg /.well-known/oauth-authorization-server/idp/realms/pid-issuer-realm }
    use_backend pid-issuer-metadata if { path /.well-known/jwt-issuer/pid-issuer }
    use_backend pid-issuer-backend if { path_beg /.well-known/openid-credential-issuer/pid-issuer }
    use_backend pid-issuer-backend if { path_beg /.well-known/oauth-protected-resource/pid-issuer }
    use_backend pid-issuer-backend if { path_beg /.well-known/jwt-vc-issuer/pid-issuer }
    use_backend pid-issuer-backend if { path_beg /pid-issuer }
    use_backend forest-debug-ui-backend if { path /app.html }
    use_backend forest-debug-ui-backend if { path /how-to-apply }
    use_backend forest-debug-ui-backend if { path /how-to-apply.html }
    use_backend forest-debug-ui-backend if { path /application-status }
    use_backend forest-debug-ui-backend if { path /application-status.html }
    use_backend forest-debug-ui-backend if { path /forest-ui.css }
    use_backend forest-debug-ui-backend if { path /tokens.css }
    use_backend forest-debug-ui-backend if { path /index.html }
    use_backend forest-debug-ui-backend if { path / }
    use_backend forest-debug-ui-backend if { path_beg /api/ }
    use_backend forest-debug-ui-backend if { path_beg /auth/ }
    use_backend forest-debug-ui-backend if { path_beg /verification-session/ }

backend keycloak-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    # Keep the original HTTPS scheme supplied by ngrok. Generating an RFC 7239
    # Forwarded header here would incorrectly report proto=http because ngrok
    # connects to HAProxy's local port 80.
    http-request del-header Forwarded
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-path /idp/realms/pid-issuer-realm/.well-known/oauth-authorization-server if { path_beg /.well-known/oauth-authorization-server/idp/realms/pid-issuer-realm }
    server server1 keycloak:8080 cookie server1 check resolvers docker init-addr last,libc,none

backend pid-issuer-metadata
    http-request return status 200 content-type application/json lf-string "{\"issuer\":\"https://localhost/pid-issuer\",\"jwks_uri\":\"https://localhost/pid-issuer/public_keys.jwks\"}"

backend pid-issuer-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    # The Issuer uses this scheme when validating the DPoP htu claim.
    http-request del-header Forwarded
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-path /pid-issuer/.well-known/openid-credential-issuer if { path_beg /.well-known/openid-credential-issuer/pid-issuer }
    http-request set-path /pid-issuer/.well-known/oauth-protected-resource if { path_beg /.well-known/oauth-protected-resource/pid-issuer }
    http-request set-path /pid-issuer/.well-known/jwt-vc-issuer if { path_beg /.well-known/jwt-vc-issuer/pid-issuer }
    server server1 pid-issuer:8080 cookie server1 check resolvers docker init-addr last,libc,none

backend forest-debug-ui-backend
    balance roundrobin
    http-request del-header Forwarded
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    server forest-ui forest-debug-ui:8088 check resolvers docker init-addr last,libc,none

backend no-match
    http-request deny deny_status 404
